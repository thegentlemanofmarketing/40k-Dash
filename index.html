<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gentleman of Marketing - Growth OS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#a98a66',
                            black: '#000000',
                            white: '#ffffff',
                            blue: '#2563eb'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Include Inter font for a clean, modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Include Lucide icons via CDN for vanilla JS -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #000000; }
        /* Custom checkbox styles to hide default and use icons */
        .task-checkbox { display: none; }
        .task-label { cursor: pointer; display: flex; align-items: flex-start; gap: 0.75rem; }
        .task-text { transition: all 0.2s ease; }
        .task-checkbox:checked + .task-text { text-decoration: line-through; color: #9ca3af; }
    </style>
</head>
<body class="min-h-screen bg-brand-white text-brand-black">

    <!-- HEADER SECTION -->
    <header class="border-b-2 border-brand-black">
        <div class="max-w-6xl mx-auto px-6 py-10">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight uppercase text-brand-black">
                        The Gentleman of <span class="text-brand-gold">Marketing</span>
                    </h1>
                    <p class="mt-2 text-xl font-medium tracking-wide text-gray-600 flex items-center gap-2">
                        <i data-lucide="target" class="w-5 h-5 text-brand-blue"></i> 12-Month Action Plan
                    </p>
                </div>
                
                <!-- OVERALL PROGRESS -->
                <div class="w-full md:w-64 bg-gray-50 p-4 border border-gray-200 rounded-lg shadow-sm">
                    <div class="flex justify-between items-end mb-2">
                        <span class="text-sm font-bold uppercase tracking-wider text-brand-black">Overall Master Plan</span>
                        <span id="overall-progress-text" class="text-2xl font-bold text-brand-blue">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="overall-progress-bar" class="h-2.5 rounded-full transition-all duration-500 ease-in-out bg-brand-blue" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-10">
        
        <!-- PHASE NAVIGATION -->
        <div id="phase-nav" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10">
            <!-- Navigation buttons will be injected here by JS -->
        </div>

        <!-- ACTIVE PHASE CONTENT -->
        <div class="bg-white border-2 border-brand-gold rounded-2xl shadow-sm p-6 md:p-10">
            
            <!-- Phase Header -->
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-10 pb-8 border-b border-gray-100">
                <div>
                    <div class="flex items-center gap-3 mb-2">
                        <span id="active-phase-months" class="px-3 py-1 text-xs font-bold uppercase tracking-wider rounded-full bg-gray-100 text-brand-black">
                            <!-- Months injected here -->
                        </span>
                        <span class="text-sm font-bold flex items-center gap-1 text-brand-gold">
                            <i data-lucide="trending-up" class="w-4 h-4"></i> Target MRR: <span id="active-phase-mrr"></span>
                        </span>
                    </div>
                    <h2 id="active-phase-title" class="text-3xl font-bold text-brand-black">
                        <!-- Title injected here -->
                    </h2>
                    <p class="text-lg mt-2 font-medium text-brand-blue">
                        Goal: <span id="active-phase-goal"></span>
                    </p>
                </div>
                
                <!-- Phase Progress -->
                <div class="w-full lg:w-48">
                    <div class="flex justify-between items-end mb-2">
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-500">Phase Progress</span>
                        <span id="phase-progress-text" class="text-lg font-bold text-brand-gold">0%</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-2">
                        <div id="phase-progress-bar" class="h-2 rounded-full transition-all duration-500 ease-in-out bg-brand-gold" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Months Grid -->
            <div id="months-grid" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Month cards will be injected here by JS -->
            </div>

        </div>
    </main>
    
    <!-- FOOTER -->
    <footer class="text-center py-10 mt-10 border-t border-gray-200">
        <p class="text-sm font-bold text-gray-400 uppercase tracking-widest flex justify-center items-center gap-2">
            <i data-lucide="target" class="w-4 h-4"></i> Growth OS Dashboard
        </p>
    </footer>

    <script>
        // --- DATA ---
        const PLAN_DATA = [
            {
                phase: 1,
                title: "Foundation & Launch",
                months: "Months 1-3",
                goal: "Secure Your First 2-3 Retainer Clients",
                targetMRR: "$5,000 - $12,000",
                icon: "briefcase",
                monthsData: [
                    {
                        month: 1,
                        focus: "Brand & Asset Creation",
                        actions: [
                            "Finalize your top 2-3 target niches (e.g., Real Estate, E-commerce).",
                            "Build your professional website and LinkedIn Company Page.",
                            "Create your polished service deck using case study data.",
                            "Begin identifying your first 50 prospects on LinkedIn."
                        ]
                    },
                    {
                        month: 2,
                        focus: "Content Launch & Initial Outreach",
                        actions: [
                            "Record and release the first 4 episodes of the MBR Podcast.",
                            "Publish 4-6 foundational blog posts targeting your niche's pain points.",
                            "Begin your personalized LinkedIn outreach campaign, providing value upfront.",
                            "Actively network in at least two relevant online communities."
                        ]
                    },
                    {
                        month: 3,
                        focus: "Securing First Clients",
                        actions: [
                            "Continue consistent outreach and networking.",
                            "Aim to book at least 4-6 strategy sessions.",
                            "Execute your sales process: Discover, Propose, and Close.",
                            "Goal: Onboard your first 2-3 retainer clients."
                        ]
                    }
                ]
            },
            {
                phase: 2,
                title: "Client Acquisition & Systemization",
                months: "Months 4-6",
                goal: "Scale to 5-8 Retainer Clients",
                targetMRR: "$15,000 - $25,000",
                icon: "users",
                monthsData: [
                    {
                        month: 4,
                        focus: "Service Delivery & Systemization",
                        actions: [
                            "Deliver exceptional results for your initial clients.",
                            "Begin documenting your service delivery into repeatable checklists.",
                            "Implement a CRM to manage your client pipeline."
                        ]
                    },
                    {
                        month: 5,
                        focus: "Building Social Proof & Ramping Up Marketing",
                        actions: [
                            "Secure your first video testimonials and written case studies from happy clients.",
                            "Host your first high-value webinar for lead generation.",
                            "Launch a small, targeted paid ad campaign to promote the webinar."
                        ]
                    },
                    {
                        month: 6,
                        focus: "Scaling Lead Flow",
                        actions: [
                            "Refine and repeat your webinar and paid ad strategy.",
                            "Double your organic outreach efforts.",
                            "Implement a simple referral program and ask your happy clients for introductions."
                        ]
                    }
                ]
            },
            {
                phase: 3,
                title: "Scaling & Authority Building",
                months: "Months 7-9",
                goal: "Reach 10-12 Retainer Clients",
                targetMRR: "$30,000 - $40,000",
                icon: "award",
                monthsData: [
                    {
                        month: 7,
                        focus: "Team & Capacity Growth",
                        actions: [
                            "Hire your first team member (e.g., a virtual assistant or junior specialist).",
                            "Use your documented processes to onboard them efficiently.",
                            "Delegate process-driven tasks to free up your time for sales and strategy."
                        ]
                    },
                    {
                        month: 8,
                        focus: "Authority Building",
                        actions: [
                            "Begin actively pursuing speaking opportunities on other podcasts or at industry events.",
                            "Start planning your first exclusive \"Gentleman of Marketing\" networking event or retreat."
                        ]
                    },
                    {
                        month: 9,
                        focus: "High-Ticket Conversion",
                        actions: [
                            "Host your signature networking event/retreat.",
                            "Use the event as a platform for thought leadership and to acquire new high-value clients.",
                            "Continue building your reputation as a go-to authority in your niche."
                        ]
                    }
                ]
            },
            {
                phase: 4,
                title: "Optimization & Expansion",
                months: "Months 10-12",
                goal: "Stabilize & Plan Future Growth",
                targetMRR: "$40,000+",
                icon: "trending-up",
                monthsData: [
                    {
                        month: 10,
                        focus: "Client & Profitability Optimization",
                        actions: [
                            "Analyze the profitability and fit of your entire client roster.",
                            "Confidently raise your prices for new clients based on your proven results."
                        ]
                    },
                    {
                        month: 11,
                        focus: "Refining the Marketing Engine",
                        actions: [
                            "Conduct a deep-dive analysis of your marketing channels.",
                            "Double down on the highest-ROI activities and cut underperforming ones.",
                            "Make your business its own best case study for marketing optimization."
                        ]
                    },
                    {
                        month: 12,
                        focus: "Strategic Planning for Year 2",
                        actions: [
                            "Celebrate achieving a consistent $40k MRR.",
                            "Create a new 12-month strategic plan for the upcoming year, focusing on sustainable growth, new service offerings, or further team expansion."
                        ]
                    }
                ]
            }
        ];

        let activePhase = 1;
        let tasks = JSON.parse(localStorage.getItem('gentlemanMarketingTasks')) || {};

        function saveTasks() {
            localStorage.setItem('gentlemanMarketingTasks', JSON.stringify(tasks));
            updateProgress();
            renderMonths(); // Re-render to update UI states (completed markers, etc.)
        }

        function toggleTask(taskId) {
            tasks[taskId] = !tasks[taskId];
            saveTasks();
        }

        function updateProgress() {
            let totalTasks = 0;
            let completedTasks = 0;
            let activePhaseCompletedTasks = 0;
            let activePhaseTotalTasks = 0;

            PLAN_DATA.forEach(phase => {
                phase.monthsData.forEach(month => {
                    month.actions.forEach((action, idx) => {
                        const taskId = `m${month.month}-a${idx}`;
                        totalTasks++;
                        if (phase.phase === activePhase) {
                            activePhaseTotalTasks++;
                        }
                        if (tasks[taskId]) {
                            completedTasks++;
                            if (phase.phase === activePhase) {
                                activePhaseCompletedTasks++;
                            }
                        }
                    });
                });
            });

            const overallProgress = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
            const phaseProgress = activePhaseTotalTasks === 0 ? 0 : Math.round((activePhaseCompletedTasks / activePhaseTotalTasks) * 100);

            document.getElementById('overall-progress-text').innerText = `${overallProgress}%`;
            document.getElementById('overall-progress-bar').style.width = `${overallProgress}%`;
            
            document.getElementById('phase-progress-text').innerText = `${phaseProgress}%`;
            document.getElementById('phase-progress-bar').style.width = `${phaseProgress}%`;
        }

        function renderNav() {
            const navContainer = document.getElementById('phase-nav');
            navContainer.innerHTML = '';
            
            PLAN_DATA.forEach(phase => {
                const isActive = phase.phase === activePhase;
                const btnClasses = isActive 
                    ? 'flex flex-col p-4 border-2 rounded-xl text-left transition-all duration-200 shadow-md translate-y-[-2px] border-brand-gold bg-brand-black text-brand-white'
                    : 'flex flex-col p-4 border-2 rounded-xl text-left transition-all duration-200 bg-white hover:border-gray-300 hover:shadow-sm border-gray-200 bg-brand-white text-brand-black';
                
                const iconColor = isActive ? 'text-brand-gold' : 'text-brand-black';
                const subTextColor = isActive ? 'text-gray-300' : 'text-gray-500';

                const btnHTML = `
                    <button onclick="setActivePhase(${phase.phase})" class="${btnClasses}">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="${iconColor}">
                                <i data-lucide="${phase.icon}" class="w-6 h-6"></i>
                            </span>
                            <span class="text-sm font-bold uppercase tracking-wider opacity-80">Phase ${phase.phase}</span>
                        </div>
                        <span class="font-bold text-lg mb-1">${phase.title}</span>
                        <span class="text-xs ${subTextColor}">${phase.months}</span>
                    </button>
                `;
                navContainer.insertAdjacentHTML('beforeend', btnHTML);
            });
            lucide.createIcons();
        }

        function setActivePhase(phaseNum) {
            activePhase = phaseNum;
            renderDashboard();
        }

        function renderDashboard() {
            const phaseData = PLAN_DATA.find(p => p.phase === activePhase);
            
            // Update Headers
            document.getElementById('active-phase-months').innerText = phaseData.months;
            document.getElementById('active-phase-mrr').innerText = phaseData.targetMRR;
            document.getElementById('active-phase-title').innerText = phaseData.title;
            document.getElementById('active-phase-goal').innerText = phaseData.goal;

            renderNav();
            renderMonths();
            updateProgress();
        }

        function renderMonths() {
            const phaseData = PLAN_DATA.find(p => p.phase === activePhase);
            const gridContainer = document.getElementById('months-grid');
            gridContainer.innerHTML = '';

            phaseData.monthsData.forEach(month => {
                const totalMonthTasks = month.actions.length;
                let completedMonthTasks = 0;
                
                month.actions.forEach((_, idx) => {
                     if(tasks[`m${month.month}-a${idx}`]) completedMonthTasks++;
                });

                const isMonthComplete = totalMonthTasks === completedMonthTasks && totalMonthTasks > 0;
                const headerBg = isMonthComplete ? 'bg-gray-50' : 'bg-white';
                const statusColor = isMonthComplete ? 'text-brand-gold' : 'text-brand-black';

                // Build Actions List HTML
                let actionsHTML = '';
                month.actions.forEach((action, idx) => {
                    const taskId = `m${month.month}-a${idx}`;
                    const isChecked = !!tasks[taskId];
                    
                    const iconHTML = isChecked 
                        ? `<i data-lucide="check-circle-2" class="w-6 h-6 text-brand-gold transition-colors duration-200"></i>`
                        : `<i data-lucide="circle" class="w-6 h-6 text-gray-300 group-hover:text-gray-400 transition-colors duration-200"></i>`;
                    
                    const textClass = isChecked ? 'line-through text-gray-400' : 'text-gray-800 font-medium';

                    actionsHTML += `
                        <label class="task-label group">
                            <input type="checkbox" class="task-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTask('${taskId}')">
                            <div class="mt-0.5 flex-shrink-0 transition-transform active:scale-90">
                                ${iconHTML}
                            </div>
                            <span class="text-sm leading-relaxed task-text ${textClass}">
                                ${action}
                            </span>
                        </label>
                    `;
                });

                const monthHTML = `
                    <div class="flex flex-col h-full bg-white border border-gray-200 rounded-xl overflow-hidden hover:shadow-lg transition-shadow duration-300">
                        <!-- Month Header -->
                        <div class="p-5 border-b border-gray-200 relative ${headerBg}">
                            ${isMonthComplete ? `<div class="absolute top-4 right-4"><i data-lucide="award" class="w-6 h-6 text-brand-gold"></i></div>` : ''}
                            <h3 class="text-xl font-bold flex items-center gap-2 mb-1 text-brand-black">
                                <i data-lucide="calendar" class="w-5 h-5 text-brand-blue"></i> 
                                Month ${month.month}
                            </h3>
                            <p class="text-sm font-semibold text-gray-600 min-h-[40px]">
                                Focus: <span class="text-brand-black">${month.focus}</span>
                            </p>
                        </div>

                        <!-- Actions List -->
                        <div class="p-5 flex-grow">
                            <h4 class="text-xs font-bold uppercase tracking-wider mb-4 text-brand-gold">
                                Action Items
                            </h4>
                            <div class="space-y-4 flex flex-col">
                                ${actionsHTML}
                            </div>
                        </div>
                        
                        <!-- Footer status -->
                        <div class="px-5 py-3 bg-gray-50 border-t border-gray-100 mt-auto flex justify-between items-center">
                            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</span>
                            <span class="text-sm font-bold ${statusColor}">
                                ${completedMonthTasks} / ${totalMonthTasks} Completed
                            </span>
                        </div>
                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', monthHTML);
            });
            
            // Re-initialize icons for newly added HTML
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderDashboard();
        });
    </script>
</body>
</html>
